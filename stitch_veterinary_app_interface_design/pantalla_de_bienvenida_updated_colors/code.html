<style>
        .paw-pattern {
            background-image: radial-gradient(circle at 50% 50%, rgba(6, 50, 43, 0.05) 0%, rgba(255,255,255,0) 60%),
                              radial-gradient(circle at 20% 30%, rgba(6, 50, 43, 0.03) 0%, rgba(255,255,255,0) 40%),
                              radial-gradient(circle at 80% 70%, rgba(6, 50, 43, 0.03) 0%, rgba(255,255,255,0) 40%);
            background-size: 200px 200px;
            animation: pulse-bg 8s infinite alternate;
        }
        @keyframes pulse-bg {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-background h-screen w-full flex items-center justify-center overflow-hidden paw-pattern font-body-lg text-primary">
<!-- Splash Content Canvas -->
<main class="flex flex-col items-center justify-center w-full max-w-md px-margin-mobile relative z-10 fade-in-up">
<!-- Logo Container -->
<div class="relative w-48 h-48 md:w-64 md:h-64 mb-stack-lg rounded-full flex items-center justify-center bg-surface shadow-md">
<img alt="EIVET Logo" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida/AEtjO1W6ewxMzS3aHIULpdF5x499bS1djODlvcHaM0MiQW67-igLKria4pFovQEjWmiX5wJp5kCVePUUn3r8QMKtoZDqukW4FLmRkYARzprQhgFD2wMhLzLcwanHV8ZX006eaBuWi1WszjqYCU-Nvag8IOiE0kazUGshes69hBcJsJI646WSeW6IQArWEpcvASDS1-gLuGIT1roNvEvrDhJPYju7dpGbXhDJP6r7egMlGccew1pRymOmrEZe2gY"/>
</div>
<!-- Brand Name -->
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-primary text-center tracking-tight">
            EIVET
        </h1>
<!-- Subtitle/Loading Indicator (Optional aesthetic addition based on design system style) -->
<div class="mt-stack-md flex items-center gap-2 opacity-80">
<span class="material-symbols-outlined text-secondary text-sm animate-spin" style="font-variation-settings: 'FILL' 1;">pets</span>
<p class="text-body-sm font-body-sm text-secondary">Loading clinical records...</p>
</div>
</main>
<!-- Navigation Suppressed (Transactional/Splash Context) -->
</body></html>
